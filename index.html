<style>
:root{
  --rose:#F8DDE8; --rose-btn:#E9AFC5; --rose-btn-h:#E29DB8; --rose-deep:#D98BAA; --rose-soft:#FCF1F5;
  --bg:#F8F8F8; --white:#FFFFFF; --text:#333333; --muted:#766E74; --line:#EEE8EB; --line-strong:#E3DADF;
  --warn-bg:#FFF3DC; --warn:#8A5A00; --bad-bg:#FBE3E6; --bad:#A23245; --ok-bg:#EAF5EE; --ok:#2F6B47;
  --r:12px; --r-s:10px;
  --sans:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  box-sizing:border-box; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose-deep);outline-offset:2px}
.ic{flex:none}

/* ---------- Layout ---------- */
.side{position:fixed;top:0;bottom:0;left:0;width:256px;background:var(--white);border-right:1px solid var(--line);
  padding:calc(22px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;z-index:30;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand img{width:34px;height:34px;object-fit:contain;border-radius:8px}
.wordmark{font:500 25px/1 var(--serif);letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.nav .soon{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-s);color:var(--text);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--rose-soft)}
.nav a.on{background:var(--rose);font-weight:600}
.nav .soon{color:#A59CA2;cursor:default}
.nav .soon em{margin-left:auto;font-style:normal;font-size:11px;background:var(--bg);color:var(--muted);padding:2px 8px;border-radius:99px}
.side-foot{margin-top:auto;font-size:13px;color:var(--muted);padding:12px;background:var(--bg);border-radius:var(--r-s)}
.side-foot.warn{background:var(--warn-bg);color:var(--warn)}
.side-foot button{all:unset;cursor:pointer;text-decoration:underline;font-weight:600;display:block;margin-top:4px}
.main{margin-left:256px;min-height:100vh}
.topbar{display:none}
#view{max-width:1120px;margin:0 auto;padding:34px 32px 64px}
.scrim{display:none}

@media (max-width:900px){
  .side{transform:translateX(-102%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.12)}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(51,51,51,.28);z-index:25}
  .main{margin-left:0}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px}
  .topbar .wordmark{font-size:21px}
  .topbar .grow{flex:1}
  #view{padding:22px 16px 56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Headings ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{font:500 32px/1.15 var(--serif);letter-spacing:-.015em}
.sub{color:var(--muted);margin-top:4px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}
h2.sec{font:600 17px/1.3 var(--sans);margin-bottom:14px}
.muted{color:var(--muted)}
small,.meta{color:var(--muted)}

/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border:1px solid transparent;border-radius:var(--r-s);
  background:var(--rose-btn);color:var(--text);font-weight:600;transition:background .15s}
.btn:hover{background:var(--rose-btn-h)}
.btn.ghost{background:var(--white);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--rose-soft)}
.btn.danger{background:var(--white);border-color:#EBC5CB;color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.danger-solid{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn.big{min-height:52px;font-size:16px}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:0;border-radius:var(--r-s);background:transparent;color:var(--muted)}
.icon-btn:hover{background:var(--rose-soft);color:var(--text)}
input,select,textarea{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:var(--r-s);background:var(--white);transition:border-color .15s,box-shadow .15s}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--rose-btn);box-shadow:0 0 0 3px rgba(233,175,197,.35)}
input[type=file]{padding:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--white);border-radius:99px;padding:6px 14px;font-weight:500;font-size:14px}
.chip:hover{background:var(--rose-soft)}
.chip.on{background:var(--rose);border-color:var(--rose);font-weight:600}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:40px}

/* ---------- Cards ---------- */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:900px){.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media (max-width:520px){.g3{grid-template-columns:1fr 1fr;gap:10px}.card{padding:16px}}
.kpi .lab{color:var(--muted);font-size:14px}
.kpi .val{font:500 26px/1.2 var(--serif);margin-top:6px;letter-spacing:-.01em}
.kpi .val span{font:500 13px var(--sans);color:var(--muted);margin-left:3px}
.kpi .note{font-size:13px;color:var(--muted);margin-top:2px}
@media (max-width:520px){.kpi .val{font-size:21px}}

.hero{background:var(--rose);border-radius:16px;padding:28px 30px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.hero .day{font-size:14px;color:#6A4B58}
.hero .lab{font-weight:600;margin-top:14px}
.hero .num{font:500 clamp(42px,8vw,64px)/1.05 var(--serif);letter-spacing:-.02em;margin-top:2px}
.hero .num span{font:600 18px var(--sans);letter-spacing:0;margin-left:8px}
.hero .hs{color:#5B4450;margin-top:6px}
.hero .btn{background:var(--white)}
.hero .btn:hover{background:var(--rose-soft)}

.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.alert{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r-s);font-weight:500}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.out{background:var(--bad-bg);color:var(--bad)}
.alert.info{background:var(--rose-soft);color:#7A4A60}
.alert button{all:unset;cursor:pointer;margin-left:auto;font-weight:600;text-decoration:underline;white-space:nowrap}

.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.low{background:var(--warn-bg);color:var(--warn)}
.badge.out{background:var(--bad-bg);color:var(--bad)}
.badge.cat{background:var(--rose-soft);color:#7A4A60}

/* ---------- Lists ---------- */
.list{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:52px 1fr 128px 116px 104px 120px;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.thumb{width:48px;height:48px;border-radius:10px;background:var(--rose);display:flex;align-items:center;justify-content:center;font:500 20px var(--serif);color:#8A5670;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.pmain{display:flex;flex-direction:column;min-width:0}
.pmain b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.pmain .meta{font-size:13px;display:flex;gap:4px 12px;flex-wrap:wrap}
.pcol{display:flex;flex-direction:column;font-weight:600}
.pcol small{font-weight:400}
.pact{display:flex;justify-content:flex-end}
.only-m{display:none}
.list-head{display:grid;grid-template-columns:52px 1fr 128px 116px 104px 120px;gap:14px;padding:0 4px 8px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line-strong)}
@media (max-width:760px){
  .prow{grid-template-columns:48px 1fr auto;gap:10px 12px}
  .prow .pstock{grid-column:3;grid-row:1}
  .prow .pact{grid-column:2 / 4;justify-content:flex-start;margin-top:-4px}
  .hide-m,.list-head{display:none}
  .only-m{display:block}
}
.toolbar{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px}
@media (max-width:760px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1 / 3}}
.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.empty h3{font:500 22px var(--serif);color:var(--text);margin-bottom:6px}
.empty .btn{margin-top:16px}
.empty-sm{padding:22px 8px;text-align:center;color:var(--muted)}

.wa{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.wa:last-child{border-bottom:0}
.wa .grow{flex:1;min-width:0}
.wa .grow b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:99px;background:var(--rose-soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--rose-btn);border-radius:99px}
.chart{width:100%;height:auto;display:block}
.chart text{font:12px var(--sans);fill:#766E74}

/* ---------- Sales ---------- */
.sale-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;align-items:start;margin-bottom:16px}
@media (max-width:900px){.sale-grid{grid-template-columns:1fr}}
.res{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.res:hover{background:var(--rose-soft)}
.res:focus-visible{outline:2px solid var(--rose-deep)}
.res[disabled]{opacity:.45;cursor:not-allowed}
.res .thumb{width:40px;height:40px;font-size:16px}
.res .grow{flex:1;min-width:0}
.res .grow b{display:block;font-weight:600}
.res .price{text-align:right;font-weight:600}
.cl{padding:12px 0;border-bottom:1px solid var(--line)}
.cl-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.step{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:var(--r-s);overflow:hidden}
.step button{width:38px;height:40px;border:0;background:var(--white);font-size:20px}
.step button:hover{background:var(--rose-soft)}
.step input{width:52px;min-height:40px;border:0;border-radius:0;text-align:center;padding:0;box-shadow:none!important}
.pin{display:flex;align-items:center;gap:6px;width:150px}
.pin span{color:var(--muted);font-size:13px}
.ltot{margin-left:auto;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.opts .full{grid-column:1 / 3}
.dwrap{display:grid;grid-template-columns:1fr 84px;gap:8px}
.trow{display:flex;justify-content:space-between;padding:4px 0}
.trow.big{font-size:22px;padding:10px 0 6px;border-top:1px solid var(--line);margin-top:6px}
.trow.big b{font:500 26px var(--serif)}
.trow.sm{font-size:14px;color:var(--muted);padding-bottom:14px}
.srow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:150px 1fr 70px 130px 120px;gap:14px;align-items:center;width:100%;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.srow:hover{background:var(--rose-soft)}
.srow:focus-visible{outline:2px solid var(--rose-deep)}
.srow:last-child{border-bottom:0}
.sh{display:grid;grid-template-columns:150px 1fr 70px 130px 120px;gap:14px;padding:0 6px 8px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line-strong)}
.srow .r,.sh .r{text-align:right}
@media (max-width:760px){
  .srow{grid-template-columns:1fr auto;gap:2px 10px}
  .srow .c-date{grid-column:1 / 3;color:var(--muted);font-size:13px}
  .srow .c-qty,.srow .c-margin{display:none}
  .sh{display:none}
}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.dates{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.dates input{width:170px}

/* ---------- Expenses ---------- */
.result{display:flex;flex-direction:column;gap:2px}
.result .trow span:first-child{color:var(--muted)}
.result .final{border-top:1px solid var(--line-strong);margin-top:8px;padding-top:12px;font-size:16px}
.result .final b{font:500 30px var(--serif)}
.neg{color:var(--bad)}

/* ---------- Modal & toast ---------- */
#modal-root .scrim2{position:fixed;inset:0;background:rgba(51,51,51,.35);z-index:60}
.modal{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 32px);overflow:auto;background:var(--white);border-radius:16px;padding:22px 22px 20px}
.modal.wide{width:min(680px,calc(100vw - 24px))}
.m-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.m-head h2{font:500 24px var(--serif)}
.m-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1 / 3}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}.fgrid .full{grid-column:1}}
.f{display:flex;flex-direction:column;gap:5px}
.f>span{font-size:13px;font-weight:600;color:#5C5459}
.mcalc{padding:10px 14px;border-radius:var(--r-s);background:var(--rose-soft);font-weight:600}
.photo-row{display:flex;align-items:center;gap:12px}
.photo-row .thumb{width:64px;height:64px}
.dl{width:100%;min-height:170px;font:12px/1.4 ui-monospace,Menlo,monospace}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:13px;color:var(--muted);font-weight:500;padding:6px 4px;border-bottom:1px solid var(--line-strong)}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--line)}
.tbl .r{text-align:right}
#toasts{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100vw - 24px)}
.toast{background:#333;color:#fff;padding:11px 18px;border-radius:99px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:100%}
.toast.err{background:var(--bad)}

/* ---------- Settings ---------- */
.set-sec{margin-bottom:16px}
.set-sec h2{font:500 22px var(--serif);margin-bottom:4px}
.set-sec .hint{color:var(--muted);margin-bottom:16px;font-size:14px}
.tag{display:inline-flex;align-items:center;gap:2px;background:var(--rose-soft);border-radius:99px;padding:4px 4px 4px 12px;font-size:14px;font-weight:500}
.tag button{all:unset;cursor:pointer;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--muted)}
.tag button:hover{background:var(--rose);color:var(--text)}
.add-row{display:flex;gap:8px;margin-top:12px}
.logo-prev{width:64px;height:64px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo-prev img{width:100%;height:100%;object-fit:contain}

/* ---------- Codes-barres et étiquettes ---------- */
input[type=checkbox]{width:18px;height:18px;min-height:0;padding:0;accent-color:#D98BAA}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
.bcp{margin-top:8px;width:240px;max-width:100%;height:64px;padding:4px 8px;background:#fff;border:1px solid var(--line);border-radius:8px}
.bcp svg{display:block;width:100%;height:100%}
.labl{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:0 12px}
.wa input.qin2{width:76px;text-align:center}
.labprev{display:flex;justify-content:center;padding:14px;background:var(--bg);border-radius:10px;margin-top:14px;overflow:auto}
.labprev .lb{border:1px dashed #C9BFC5;flex:none}
#print-root{display:none}
@media print{
  :root{padding:0!important}
  body{background:#fff!important}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block!important}
}

/* ---------- Clients ---------- */
.cstats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
@media (max-width:520px){.cstats{grid-template-columns:1fr 1fr;gap:10px}.cstats .card:last-child{grid-column:1 / 3}}
.ctool{display:grid;grid-template-columns:1fr 230px;gap:10px;margin-bottom:14px}
@media (max-width:640px){.ctool{grid-template-columns:1fr}}
.crow,.chead{display:grid;grid-template-columns:44px minmax(0,1.6fr) 140px 76px 130px 120px 112px;gap:12px;align-items:center}
.crow{padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.crow:hover{background:var(--rose-soft)}
.crow:last-child{border-bottom:0}
.crow .thumb{width:44px;height:44px}
.chead{padding:0 4px 8px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line-strong)}
.cname{all:unset;cursor:pointer;display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cname:focus-visible{outline:2px solid var(--rose-deep);outline-offset:2px;border-radius:4px}
.crow .cs-only{display:none}
@media (max-width:1160px){
  .chead{display:none!important}
  .crow{grid-template-columns:44px minmax(0,1fr);gap:8px 12px}
  .crow .pact{grid-column:2;justify-content:flex-start;margin-top:-4px}
  .crow .cs-hide{display:none}
  .crow .cs-only{display:flex}
}
.fiche-top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.fiche-top .thumb{width:56px;height:56px;font-size:22px;flex:none}
.tel{font-weight:600;color:var(--text);text-decoration:underline;text-decoration-color:var(--rose-btn);text-underline-offset:3px}
.fstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.fstats>div{background:var(--rose-soft);border-radius:var(--r-s);padding:12px 14px}
.fstats .l{font-size:13px;color:var(--muted)}
.fstats .v{font:500 20px/1.25 var(--serif);margin-top:2px}
@media (max-width:520px){.fstats{grid-template-columns:1fr 1fr}.fstats>div:last-child{grid-column:1 / 3}}
.irow{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:0}
.irow>span:first-child{width:150px;flex:none;color:var(--muted)}
.irow>span:last-child{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:520px){.irow{flex-direction:column;gap:2px}.irow>span:first-child{width:auto;font-size:13px}}
.hscroll{overflow-x:auto}
.cchip{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border:1px solid var(--line-strong);border-radius:var(--r-s);background:var(--rose-soft)}
.cchip .thumb{width:36px;height:36px;font-size:15px;flex:none}
.cchip .grow{flex:1;min-width:0}
.cchip b{display:block;font-weight:600}
.cbox{border:1px solid var(--line);border-radius:10px;padding:4px 8px;margin-top:8px}
.add-row .search{flex:1}

/* ---------- Statistiques ---------- */
.stchips{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:640px){.stchips{flex-wrap:nowrap;overflow-x:auto;margin:0 -4px;padding:0 4px 4px}.stchips .chip{flex:none}}
.stk .val{overflow-wrap:anywhere}
.stk .delta{margin-top:8px}
.stcmp{font-size:13px;color:var(--muted);margin:0 0 16px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:3px;border-radius:2px;background:#D98BAA}
.legend i.dash{background:repeating-linear-gradient(90deg,#A59CA2 0 5px,transparent 5px 9px)}
.stc{width:100%}
.insight{margin-top:10px;font-size:14px;color:var(--muted)}
.rk{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rn{width:28px;height:28px;border-radius:50%;background:var(--rose);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.rk .grow{flex:1;min-width:0}
.rk-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rk-top b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.rk-top span{white-space:nowrap}
/* ---------- Autorisations des employés / session ---------- */
.toggle{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-width:92px;padding:7px 14px;border-radius:99px;border:1px solid var(--line-strong);background:var(--white);font-weight:600;font-size:14px}
.toggle.on{background:var(--ok-bg);border-color:#BFE1CC;color:var(--ok)}
.toggle:not(.on){background:var(--bad-bg);border-color:#F0C7CC;color:var(--bad)}
.permlist{display:flex;flex-direction:column}

<script>
'use strict';
/* =====================================================================
   SHOPY V1 – architecture
   1. Données   : IndexedDB (produits, ventes, dépenses, mouvements, paramètres)
   2. État      : copie en mémoire, écrite dans la base à chaque modification
   3. Pages     : une fonction par page (pg*) + une fonction d'initialisation
   4. Sauvegarde: export/import JSON complet (Paramètres)
   Pour ajouter une page : ajouter une entrée dans NAV, pages{} et inits{}.
   ===================================================================== */

/* ---------- Utilitaires ---------- */
const $  = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const nf = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 });
const money = n => nf.format(Math.round((+n || 0) * 100) / 100) + '\u00A0DZD';
const moneyNum = n => nf.format(Math.round((+n || 0) * 100) / 100);
const num = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const plural = (n, a, b) => n > 1 ? b : a;
const pad = n => String(n).padStart(2, '0');
const dKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => dKey(new Date());
const parseDay = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfMonth = d => new Date(d.getFullYear(), d.getMonth(), 1);
const nextMonth = d => new Date(d.getFullYear(), d.getMonth() + 1, 1);
const startOfWeek = d => { const s = startOfDay(d); return addDays(s, -((s.getDay() - state.settings.weekStart + 7) % 7)); };
const fmtDate = iso => new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtDay = s => parseDay(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtDT = iso => new Date(iso).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const toLocalInput = d => `${dKey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const short = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + ' M' : n >= 1000 ? (n / 1000).toFixed(1).replace('.0', '') + ' k' : String(Math.round(n));

const ICONS = {
  home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  bag:'<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  receipt:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
  clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  box:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  drop:'<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>',
  wallet:'<rect x="2" y="6" width="20" height="14" rx="3"/><path d="M2 10h20"/><circle cx="17" cy="15" r="1"/>',
  chart:'<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
  sliders:'<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
  search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
  alert:'<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  menu:'<line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>',
  barcode:'<path d="M4 5v14M7 5v14M11 5v14M14 5v14M17 5v14M20 5v14"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  dot:'<circle cx="12" cy="12" r="5"/>'
};
const ic = (n, s = 18) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const mark = (s = 34) => { let p = ''; for (let i = 0; i < 5; i++) p += `<ellipse cx="16" cy="8.6" rx="4.6" ry="6.6" transform="rotate(${i * 72} 16 16)"/>`; return `<svg width="${s}" height="${s}" viewBox="0 0 32 32" aria-hidden="true"><g fill="#E9AFC5">${p}</g><circle cx="16" cy="16" r="3.2" fill="#fff"/></svg>`; };

/* ---------- Constantes ---------- */
const EXPENSE_CATS = ['Achat de marchandises', 'Loyer', 'Publicité', 'Électricité', 'Transport', 'Salaires', 'Travaux', 'Autres dépenses'];
const COGS_CAT = 'Achat de marchandises';
const DEFAULT_SETTINGS = {
  key: 'main', shopName: 'Shopy', logo: '', currency: 'DZD', defaultAlert: 5, weekStart: 0,
  categories: ['Maquillage', 'Soin visage', 'Soin corps', 'Cheveux', 'Parfums', 'Ongles', 'Accessoires'],
  brands: [], suppliers: [], lastBackup: null, barcodeSeq: 0,
  label: { fmt: 'a4-24', w: 50, h: 30, showName: true, showPrice: true },
  materialCats: ['Notes parfumées', 'Huiles essentielles', 'Éthanol', 'Eau distillée', 'PEG-40', 'Fixateur', 'Conservateur', 'Vitamine B5', 'Colorants', 'Autres ingrédients'],
  containerFormats: ['Flacon 40 ml', 'Flacon 100 ml', 'Flacon 200 ml', 'Vaporisateur', 'Bouchon', 'Autre'],
  matBarcodeSeq: 0, conBarcodeSeq: 0,
  expectedArrival: '', adminPin: ''
};
const MOVE_LABELS = { sale: 'Vente', cancel: 'Vente annulée', receive: 'Réception', adjust: 'Inventaire', init: 'Stock initial' };
const PMOVE_LABELS = { in: 'Entrée', out: 'Sortie', adjust: 'Ajustement', init: 'Stock initial', production: 'Production' };
/* Conversions ml/L et g/kg pour les matières premières et contenants */
const UNIT_GROUPS = { ml: 'vol', L: 'vol', g: 'mass', kg: 'mass', 'unité': 'unit' };
const UNIT_BASE = { ml: 1, L: 1000, g: 1, kg: 1000, 'unité': 1 };
const convQty = (qty, from, to) => (from === to) ? qty : (UNIT_GROUPS[from] !== UNIT_GROUPS[to] ? null : qty * UNIT_BASE[from] / UNIT_BASE[to]);

/* ---------- Base de données (IndexedDB) ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('no-idb'));
      const r = indexedDB.open('shopy-db', 4);
      r.onupgradeneeded = () => {
        const d = r.result;
        ['products', 'sales', 'expenses', 'moves', 'clients', 'materials', 'containers', 'pmoves', 'perfumes', 'employees', 'shifts'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: 'id' }); });
        if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'key' });
      };
      r.onsuccess = () => { this.db = r.result; this.db.onversionchange = () => this.db.close(); res(); };
      r.onerror = () => rej(r.error);
      let blockedTimer = null;
      r.onblocked = () => {
        toast('Fermez les autres fenêtres de Shopy pour terminer la mise à jour', 'err');
        if (!blockedTimer) blockedTimer = setTimeout(() => rej(new Error('blocked')), 4000);
      };
    });
  },
  getAll(store) {
    return new Promise((res, rej) => {
      const q = this.db.transaction(store).objectStore(store).getAll();
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  },
  batch(ops) {
    if (!this.db || !ops.length) return Promise.resolve();
    return new Promise((res, rej) => {
      const names = [...new Set(ops.map(o => o.store))];
      const tx = this.db.transaction(names, 'readwrite');
      ops.forEach(o => {
        const s = tx.objectStore(o.store);
        if (o.clear) s.clear();
        else if (o.put) s.put(o.put);
        else if (o.del !== undefined) s.delete(o.del);
      });
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  }
};
async function persist(ops) {
  try { await DB.batch(ops); cloudPush(ops); return true; }
  catch (e) { console.error(e); toast('Enregistrement impossible sur cet appareil', 'err'); return false; }
}

/* ---------- Synchronisation cloud (Firebase, facultative — Shopy fonctionne sans) ---------- */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDb4xGfb7irfzUuplV_XSba2VK-N803wkg",
  authDomain: "shopy-929f8.firebaseapp.com",
  projectId: "shopy-929f8",
  storageBucket: "shopy-929f8.firebasestorage.app",
  messagingSenderId: "724032398207",
  appId: "1:724032398207:web:5bc464fa6099994b2b704a"
};
const CLOUD_STORES = ['products', 'sales', 'expenses', 'moves', 'clients', 'materials', 'containers', 'pmoves', 'perfumes', 'employees', 'shifts'];
const cloud = { app: null, auth: null, db: null, ready: false, user: null, unsub: [], bootDone: {}, err: '' };
function cloudInit() {
  try {
    if (typeof firebase === 'undefined') return false;
    cloud.app = firebase.initializeApp(FIREBASE_CONFIG);
    cloud.auth = firebase.auth();
    cloud.db = firebase.firestore();
    try { cloud.db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}
    cloud.auth.onAuthStateChanged(u => { cloud.user = u; onCloudAuthChange(u); });
    cloud.ready = true;
    return true;
  } catch (e) { console.error('cloud init', e); cloud.err = 'init'; return false; }
}
function cloudErrMsg(e) {
  const c = (e && e.code) || '';
  if (c.includes('wrong-password') || c.includes('invalid-credential') || c.includes('invalid-login')) return 'E-mail ou mot de passe incorrect';
  if (c.includes('user-not-found')) return 'Aucun compte avec cet e-mail';
  if (c.includes('network')) return 'Pas de connexion internet pour le moment';
  if (c.includes('too-many-requests')) return 'Trop de tentatives, réessayez dans un moment';
  return 'Connexion impossible' + (c ? ' (' + c + ')' : '');
}
async function cloudSignIn(email, pass) {
  if (!cloud.ready) return { ok: false, err: 'Service de synchronisation indisponible sur cet appareil' };
  try { await cloud.auth.signInWithEmailAndPassword(email, pass); return { ok: true }; }
  catch (e) { return { ok: false, err: cloudErrMsg(e) }; }
}
function cloudSignOut() { if (cloud.ready && cloud.auth) cloud.auth.signOut(); }
function onCloudAuthChange(user) {
  cloud.unsub.forEach(u => { try { u(); } catch (e) {} });
  cloud.unsub = []; cloud.bootDone = {};
  if (user) cloudStartSync();
  try { refresh(); } catch (e) {}
}
function cloudStartSync() {
  CLOUD_STORES.forEach(store => {
    cloud.bootDone[store] = false;
    const unsub = cloud.db.collection(store).onSnapshot(snap => {
      snap.docChanges().forEach(ch => {
        const arr = state[store];
        if (ch.type === 'removed') { state[store] = arr.filter(x => x.id !== ch.doc.id); DB.batch([{ store, del: ch.doc.id }]).catch(() => {}); }
        else {
          const data = ch.doc.data(), i = arr.findIndex(x => x.id === ch.doc.id);
          if (i >= 0) arr[i] = data; else arr.push(data);
          DB.batch([{ store, put: data }]).catch(() => {});
          if (cloud.bootDone[store] && ch.type === 'added') cloudNotify(store, data);
        }
      });
      cloud.bootDone[store] = true;
      try { refresh(); } catch (e) {}
    }, err => console.error('sync', store, err));
    cloud.unsub.push(unsub);
  });
  const sUnsub = cloud.db.collection('settings').doc('main').onSnapshot(doc => {
    if (doc.exists) { state.settings = { ...clone(DEFAULT_SETTINGS), ...doc.data() }; DB.batch([{ store: 'settings', put: state.settings }]).catch(() => {}); try { refresh(); } catch (e) {} }
  }, err => console.error('sync settings', err));
  cloud.unsub.push(sUnsub);
}
/* Chaque écriture locale (persist) est aussi envoyée au cloud si une session de synchronisation est active */
function cloudPush(ops) {
  if (!cloud.ready || !cloud.user || !cloud.db) return;
  ops.forEach(o => {
    try {
      if (o.store === 'settings') { if (o.put) cloud.db.collection('settings').doc('main').set(o.put).catch(() => {}); }
      else if (CLOUD_STORES.includes(o.store)) {
        if (o.put) cloud.db.collection(o.store).doc(o.put.id).set(o.put).catch(() => {});
        else if (o.del !== undefined) cloud.db.collection(o.store).doc(o.del).delete().catch(() => {});
        /* o.clear (ex. restauration d'une sauvegarde) n'efface pas le cloud automatiquement : chaque élément restauré est réécrit individuellement ci-dessus */
      }
    } catch (e) { console.error('cloudPush', e); }
  });
}
function cloudNotify(store, data) {
  if (ui.session.role !== 'admin') return;
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  let title = '', body = '';
  if (store === 'shifts') {
    const emp = state.employees.find(e => e.id === data.employeeId);
    const name = emp ? emp.name : 'Une employée';
    if (data.outTime) { title = 'Départ'; body = `${name} vient de pointer son départ`; }
    else if (data.inTime) { title = 'Arrivée'; body = `${name} vient de pointer son arrivée`; }
    else return;
  } else if (store === 'sales') {
    title = 'Nouvelle vente'; body = `${saleSummary(data).replace(/<[^>]+>/g, '')} — ${money(data.total)}`;
  } else return;
  try { new Notification(title, { body, icon: state.settings.logo || undefined }); } catch (e) {}
}

/* ---------- État ---------- */
const state = { products: [], sales: [], expenses: [], moves: [], clients: [], materials: [], containers: [], pmoves: [], perfumes: [], employees: [], shifts: [], settings: clone(DEFAULT_SETTINGS), persistent: true };
const ui = {
  route: 'dashboard', chartRange: 7,
  prod: { q: '', cat: '', brand: '', sort: 'name', flt: 'all' },
  stockQ: '', saleQ: '',
  hist: { range: 'today', from: '', to: '' },
  exp: { month: '' },
  cart: { lines: [], disc: '', dtype: 'amt', clientId: '' },
  cli: { q: '', sort: 'last' }, cq: '', clientCtx: 'list',
  st: { range: 'month', from: '', to: '' },
  perf: { tab: 'dash', matQ: '', matCat: '', matFlt: 'all', conQ: '', conFmt: '', conFlt: 'all', mvQ: '', histQ: '' },
  recipe: { q: '', name: '', containerId: '', lines: [] }, moveKind: '',
  hor: { view: 'punch', histMonth: '', adminEmp: '', adminMonth: '' },
  session: { role: null, employeeId: null }, permsEmp: '', permsDraft: null,
  photoTmp: '', editId: null, lab: { qty: {}, q: '' }, gateView: 'pass'
};
/* ---------- Autorisations des employés ---------- */
const PERM_DEFS = [
  ['sales', 'Ventes'], ['products', 'Produits'], ['stock', 'Stock'], ['horaires', 'Horaires'],
  ['clients', 'Clients'], ['suppliers', 'Fournisseurs'], ['perfumes', 'Parfums sur mesure'], ['expenses', 'Dépenses'],
  ['stats', 'Statistiques'], ['revenue', "Chiffre d'affaires"], ['margins', 'Marges'], ['profit', 'Bénéfices'],
  ['settings', 'Paramètres'], ['employees', 'Gestion des employés']
];
/* Par défaut : outils du quotidien ouverts, chiffres sensibles et administration fermés tant que rien n'est configuré */
const DEFAULT_PERM = { sales: true, products: true, stock: true, horaires: true, clients: true, suppliers: true, perfumes: true, expenses: true, stats: false, revenue: false, margins: false, profit: false, settings: false, employees: false };

/* ---------- Calculs ---------- */
const status = p => p.qty <= 0 ? 'out' : p.qty <= p.alert ? 'low' : 'ok';
const badge = p => { const s = status(p); return s === 'out' ? '<span class="badge out">Rupture</span>' : `<span class="badge ${s}">${p.qty} en stock</span>`; };
const sumSales = (from, to) => {
  let ca = 0, cost = 0, n = 0;
  state.sales.forEach(s => { const d = new Date(s.date); if (d >= from && (!to || d < to)) { ca += s.total; cost += s.cost; n++; } });
  return { ca, cost, n, margin: ca - cost };
};
const expensesIn = (from, to, withCogs = false) => state.expenses
  .filter(e => { const d = parseDay(e.date); return d >= from && d < to && (withCogs || e.category !== COGS_CAT); })
  .reduce((a, e) => a + e.amount, 0);
const salesSorted = () => [...state.sales].sort((a, b) => b.date.localeCompare(a.date));
const uniqueVals = (field, list) => [...new Set([...(state.settings[list] || []), ...state.products.map(p => p[field]).filter(Boolean)])].sort((a, b) => a.localeCompare(b, 'fr'));
const soldSince = from => {
  const map = {};
  state.sales.forEach(s => { if (new Date(s.date) >= from) s.lines.forEach(l => { const m = map[l.pid] || (map[l.pid] = { pid: l.pid, name: l.name, qty: 0, ca: 0 }); m.qty += l.qty; m.ca += l.qty * l.price; }); });
  return Object.values(map).sort((a, b) => b.qty - a.qty || b.ca - a.ca);
};
const saleSummary = s => { const f = s.lines[0]; return esc(f.name) + (f.qty > 1 ? ` ×${f.qty}` : '') + (s.lines.length > 1 ? ` <small>+ ${s.lines.length - 1} ${plural(s.lines.length - 1, 'autre', 'autres')}</small>` : ''); };

function niceMax(m) { const p = Math.pow(10, Math.floor(Math.log10(m))), n = m / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function chartSVG(n) {
  const days = [];
  const today = startOfDay(new Date());
  for (let i = n - 1; i >= 0; i--) days.push(addDays(today, -i));
  const byDay = {};
  state.sales.forEach(s => { const k = dKey(new Date(s.date)); byDay[k] = (byDay[k] || 0) + s.total; });
  const data = days.map(d => ({ d, v: byDay[dKey(d)] || 0 }));
  const W = 640, H = 230, pl = 46, pr = 6, pt = 12, pb = 28;
  const mx = niceMax(Math.max(...data.map(x => x.v), 1));
  const step = (W - pl - pr) / n, bw = Math.min(34, step * .62), ph = H - pt - pb;
  let g = '';
  [0, .5, 1].forEach(k => {
    const y = pt + ph - ph * k;
    g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="#EEE8EB"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end">${short(mx * k)}</text>`;
  });
  data.forEach((x, i) => {
    const h = x.v / mx * ph, bx = pl + i * step + (step - bw) / 2, last = i === n - 1;
    g += `<rect x="${bx}" y="${pt + ph - Math.max(h, x.v ? 2 : 0)}" width="${bw}" height="${Math.max(h, x.v ? 2 : 0)}" rx="${Math.min(6, bw / 2)}" fill="${last ? '#D98BAA' : '#F0BFD2'}"><title>${x.d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })} : ${money(x.v)}</title></rect>`;
    const lab = n <= 7 ? x.d.toLocaleDateString('fr-FR', { weekday: 'short' }) : ((n - 1 - i) % 5 === 0 ? x.d.getDate() : '');
    if (lab !== '') g += `<text x="${bx + bw / 2}" y="${H - 8}" text-anchor="middle">${lab}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chiffre d'affaires des ${n} derniers jours">${g}</svg>`;
}

/* Nombre d'achats, total dépensé et dernier achat : toujours calculés à partir des ventes enregistrées */
function clientStats() {
  const m = {};
  state.sales.forEach(s => {
    if (!s.clientId) return;
    const x = m[s.clientId] || (m[s.clientId] = { n: 0, total: 0, last: '', sales: [] });
    x.n++; x.total += s.total; x.sales.push(s); if (s.date > x.last) x.last = s.date;

  Object.values(m).forEach(x => x.sales.sort((a, b) => b.date.localeCompare(a.date)));

}
const statOf = (m, id) => m[id] || { n: 0, total: 0, last: '', sales: [] };
function clientMatches(c, q) {

  const names = norm(clientName(c) + ' ' + (c.last || '') + ' ' + (c.first || '')), digits = String(c.phone || '').replace(/\D/g, '');
  return toks.every(t => /^[\d+()\-.]+$/.test(t) ? (t.replace(/\D/g, '') !== '' && digits.includes(t.replace(/\D/g, ''))) : names.includes(t));
}

  const p = q.split(/\s+/); return { first: p[0], last: p.slice(1).join(' ') };
}

/* ---- Scan de code-barres (caméra si disponible, sinon saisie manuelle) ---- */
let scanStream = null, scanRAF = null;
function stopScan() { if (scanRAF) { cancelAnimationFrame(scanRAF); scanRAF = null; } if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; } }
function openScan() {
  openModal('Scanner un code-barres', `<div id="scanArea"><div class="empty-sm">Ouverture de la caméra...</div></div>
    <div class="add-row" style="margin-top:14px"><input id="scanManual" placeholder="Ou saisissez le code manuellement" inputmode="numeric" data-key="scanEnter" aria-label="Saisir un code-barres"><button type="button" class="btn ghost" data-act="scanManualGo">Rechercher</button></div>`);
  startScanCamera();
}
async function startScanCamera() {
  const area = $('#scanArea'); if (!area) return;
  if (!('BarcodeDetector' in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    area.innerHTML = '<div class="empty-sm">Le scan par caméra n\'est pas disponible sur ce navigateur.<br>Saisissez le code ci-dessous.</div>'; return;
  }
  try { scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
  catch (e) { area.innerHTML = '<div class="empty-sm">Accès à la caméra refusé ou indisponible.<br>Saisissez le code ci-dessous.</div>'; return; }
  area.innerHTML = '<video id="scanVideo" class="scanvid" playsinline muted autoplay></video>';
  const video = $('#scanVideo'); if (!video) { stopScan(); return; }
  video.srcObject = scanStream; try { await video.play(); } catch (e) {}
  let detector; try { detector = new BarcodeDetector({ formats: ['ean_13', 'code_128'] }); }
  catch (e) { area.innerHTML += '<div class="empty-sm">Ce navigateur ne supporte pas les formats de code-barres utilisés ici.</div>'; stopScan(); return; }
  const loop = async () => {
    if (!scanStream) return;
    try { const codes = await detector.detect(video); if (codes.length) { const val = codes[0].rawValue; stopScan(); handleScanned(val); return; } } catch (e) {}
    scanRAF = requestAnimationFrame(loop);
  };
  scanRAF = requestAnimationFrame(loop);
}
function handleScanned(code) {
  code = String(code || '').trim(); if (!code) return;
  const m = state.materials.find(x => x.barcode === code || (x.sku && x.sku === code));
  if (m) { closeModal(); materialForm(m.id); return; }
  const c = state.containers.find(x => x.barcode === code || (x.sku && x.sku === code));
  if (c) { closeModal(); containerForm(c.id); return; }
  const p = state.products.find(x => x.barcode === code || (x.sku && x.sku === code));
  if (p) { closeModal(); productForm(p.id); return; }
  toast(`Aucun article trouvé pour le code ${code}`, 'err');
  if ($('#scanArea')) startScanCamera();
}

const todayShift = empId => state.shifts.find(s => s.employeeId === empId && s.date === todayKey());
const fmtHM = iso => new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
const fmtDuration = mins => { if (mins == null) return ''; const h = Math.floor(mins / 60), m = Math.round(mins % 60); return `${h}h${pad(m)}`; };
const shiftDurationMin = s => (!s.inTime || !s.outTime) ? null : (new Date(s.outTime) - new Date(s.inTime)) / 60000;
const lateLabel = mins => mins == null ? '' : mins > 0 ? `Retard : ${mins} min` : mins < 0 ? `En avance : ${-mins} min` : 'À l\'heure';
function computeLate(expected, inIso) {
  if (!expected) return null;
  const [h, m] = expected.split(':').map(Number), d = new Date(inIso), exp = new Date(d); exp.setHours(h, m, 0, 0);
  return Math.round((d - exp) / 60000);
}

    try { const jf = await toJpegIfHeic(f); ui.photoTmp = await readImage(jf, 480, 'image/jpeg'); $('#photoPrev').innerHTML = `<img src="${ui.photoTmp}" alt="">`; } catch (e) { toast('Cette image ne peut pas être lue', 'err'); }
  },
  dtype(t) { ui.cart.dtype = t.value; renderTotals(); },
  qtySet(t) {
    const l = ui.cart.lines[+t.dataset.i], p = state.products.find(x => x.id === l.pid), max = p ? p.qty : l.qty;
    let q = Math.round(num(t.value)); if (q < 1) q = 1; if (q > max) { q = max; toast(`Stock insuffisant : ${max} disponible${plural(max, '', 's')}`, 'err'); }
    l.qty = q; renderCart();
  },
  priceSet(t) { ui.cart.lines[+t.dataset.i].price = Math.max(0, num(t.value)); renderCart(); },
  hFrom(t) { ui.hist.from = t.value; inits.history(); },
  hTo(t) { ui.hist.to = t.value; inits.history(); },
  expMonth(t) { ui.exp.month = t.value || todayKey().slice(0, 7); render(); },
  async setField(t) {
    const k = t.dataset.k; let v = t.value;
    if (k === 'defaultAlert') v = Math.max(0, Math.round(num(v)));
    if (k === 'weekStart') v = +v;
    if (k === 'shopName') v = v.trim() || 'Shopy';
    state.settings[k] = v; await saveSettings(); refreshSide(); toast('Enregistré');
  },
  async pickLogo(t) {
    const f = t.files[0]; if (!f) return;
    try { const jf = await toJpegIfHeic(f); state.settings.logo = await readImage(jf, 240, 'image/png'); await saveSettings(); refresh(); toast('Logo enregistré'); } catch (e) { toast('Cette image ne peut pas être lue', 'err'); }
  },
  importFile(t) { const f = t.files[0]; if (f) importBackup(f); t.value = ''; },
  labFmt(t) { state.settings.label.fmt = t.value; saveSettings(); labRefresh(); },
  labW(t) { state.settings.label.w = Math.min(200, Math.max(20, num(t.value) || 50)); saveSettings(); labRefresh(); },
  labH(t) { state.settings.label.h = Math.min(200, Math.max(15, num(t.value) || 30)); saveSettings(); labRefresh(); },
  labName(t) { state.settings.label.showName = t.checked; saveSettings(); labRefresh(); },
  labPrice(t) { state.settings.label.showPrice = t.checked; saveSettings(); labRefresh(); },
  matCat(t) { ui.perf.matCat = t.value; renderMatList(); },
  conFmt(t) { ui.perf.conFmt = t.value; renderConList(); },
  recipeContainer(t) { ui.recipe.containerId = t.value; renderRecipeTotals(); },
  rUnitSet(t) { ui.recipe.lines[+t.dataset.i].unit = t.value; renderRecipeLines(); },
  pmType(t) { const lab = $('#pmqtyLab span'); if (!lab) return; const it = (ui.moveKind === 'material' ? state.materials : state.containers).find(x => x.id === ui.editId); const u = it ? it.unit : ''; lab.textContent = t.value === 'adjust' ? `Nouvelle quantité en stock (${u})` : t.value === 'in' ? `Quantité entrée (${u})` : `Quantité sortie (${u})`; },
  permsEmp(t) { ui.permsEmp = t.value; ui.permsDraft = null; render(); }
};
const keys = {
  saleEnter(t, e) {
    if (e.key !== 'Enter') return; e.preventDefault();
    const q = norm(t.value.trim()); if (!q) return;
    const exact = state.products.find(p => norm(p.barcode) === q || norm(p.sku) === q);
    const found = exact || (() => { const a = state.products.filter(p => norm([p.name, p.brand, p.sku, p.barcode].join(' ')).includes(q)); return a.length === 1 ? a[0] : null; })();
    if (found) { addToCart(found.id); t.value = ''; ui.saleQ = ''; renderSaleResults(); }
    else toast('Choisissez un produit dans la liste', 'err');
  },
  listEnter(t, e) { if (e.key === 'Enter') { e.preventDefault(); addListItem(t.dataset.k); } },
  clientEnter(t, e) {
    if (e.key !== 'Enter') return; e.preventDefault();
    const q = t.value.trim(); if (!q) return;
    const ms = state.clients.filter(c => clientMatches(c, q));
    if (ms.length === 1) { ui.cart.clientId = ms[0].id; renderClientPicker(); }
    else if (!ms.length) clientForm(null, { ctx: 'sale', q });
    else toast('Choisissez un client dans la liste', 'err');
  },
  recipeEnter(t, e) {
    if (e.key !== 'Enter') return; e.preventDefault();
    const q = norm(t.value.trim()); if (!q) return;
    const exact = state.materials.find(m => norm(m.barcode) === q || norm(m.sku) === q);
    const found = exact || (() => { const a = state.materials.filter(m => norm([m.name, m.sku, m.barcode].join(' ')).includes(q)); return a.length === 1 ? a[0] : null; })();
    if (found) { actions.addRecipeLine({ dataset: { id: found.id } }); t.value = ''; ui.recipe.q = ''; renderRecipeResults(); }
    else toast('Choisissez une matière dans la liste', 'err');
  },
  scanEnter(t, e) { if (e.key === 'Enter') { e.preventDefault(); handleScanned(t.value); } }
};
const forms = {
  sessionpin(f) {
    const pin = (f.pin.value || '').trim();
    if (pin !== state.settings.adminPin) { toast('Mot de passe incorrect', 'err'); return; }
    ui.session = { role: 'admin', employeeId: null }; saveSession(); closeModal(); refresh();
  },
  gatepass(f) {
    const pw = f.pw.value || '';
    if (pw !== state.settings.adminPin) { toast('Mot de passe incorrect', 'err'); return; }
    ui.session = { role: 'admin', employeeId: null }; saveSession(); refresh();
  },
  async cloudlogin(f) {
    const email = f.email.value.trim(), pass = f.pass.value;
    const btn = f.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
    const r = await cloudSignIn(email, pass);
    if (btn) btn.disabled = false;
    if (!r.ok) return toast(r.err, 'err');
    toast('Connecté·e — synchronisation en cours'); render();
  },
  async product(f) {
    const d = Object.fromEntries(new FormData(f)), name = (d.name || '').trim();
    if (!name) return toast('Ajoutez un nom de produit', 'err');
    const o = { name, category: d.category.trim(), brand: d.brand.trim(), sku: d.sku.trim(), barcode: d.barcode.trim(), buy: num(d.buy), sell: num(d.sell), qty: Math.max(0, Math.round(num(d.qty))), alert: Math.max(0, Math.round(num(d.alert))), supplier: d.supplier.trim(), added: d.added || todayKey(), photo: ui.photoTmp || '' };
    if (o.barcode && state.products.some(x => x.barcode === o.barcode && x.id !== ui.editId)) return toast('Ce code-barres est déjà utilisé par un autre produit', 'err');
    const ops = []; let p;
    if (ui.editId) {
      p = state.products.find(x => x.id === ui.editId); const old = p.qty; Object.assign(p, o);
      if (old !== p.qty) ops.push({ store: 'moves', put: mkMove(p, p.qty - old, 'adjust') });
    } else {
      p = { id: uid(), ...o }; state.products.push(p);
      if (p.qty > 0) ops.push({ store: 'moves', put: mkMove(p, p.qty, 'init') });
    }
    ops.push({ store: 'products', put: p });
    let sc = false;
    [['category', 'categories'], ['brand', 'brands'], ['supplier', 'suppliers']].forEach(([k, l]) => { if (o[k] && !state.settings[l].includes(o[k])) { state.settings[l].push(o[k]); state.settings[l].sort((a, b) => a.localeCompare(b, 'fr')); sc = true; } });
    if (sc) ops.push({ store: 'settings', put: state.settings });
    closeModal(); await persist(ops); toast(ui.editId ? 'Produit modifié' : 'Produit ajouté'); refresh();
  },
  async receive(f) {
    const p = state.products.find(x => x.id === ui.editId); if (!p) return;
    const q = Math.round(num(f.qty.value)); if (q < 1) return toast('Indiquez une quantité', 'err');
    p.qty += q; if (f.buy.value !== '') p.buy = num(f.buy.value);
    closeModal(); await persist([{ store: 'products', put: p }, { store: 'moves', put: mkMove(p, q, 'receive') }]);
    toast(`${q} ajouté${plural(q, '', 's')} au stock`); refresh();
  },
  async adjust(f) {
    const p = state.products.find(x => x.id === ui.editId); if (!p) return;
    const q = Math.max(0, Math.round(num(f.qty.value))), delta = q - p.qty; p.qty = q; closeModal();
    const ops = [{ store: 'products', put: p }]; if (delta) ops.push({ store: 'moves', put: mkMove(p, delta, 'adjust') });
    await persist(ops); toast('Stock mis à jour'); refresh();
  },
  async expense(f) {
    const d = Object.fromEntries(new FormData(f)), amount = num(d.amount);
    if (!(amount > 0)) return toast('Indiquez un montant', 'err');
    let e;
    if (ui.editId) { e = state.expenses.find(x => x.id === ui.editId); Object.assign(e, { category: d.category, description: d.description.trim(), amount, date: d.date }); }
    else { e = { id: uid(), category: d.category, description: d.description.trim(), amount, date: d.date }; state.expenses.push(e); }
    closeModal(); await persist([{ store: 'expenses', put: e }]); toast('Dépense enregistrée'); render();
  },
  async client(f) {
    const d = Object.fromEntries(new FormData(f)), first = (d.first || '').trim(), last = (d.last || '').trim(), phone = (d.phone || '').trim();
    if (!first) return toast('Ajoutez un prénom', 'err');
    if (!last) return toast('Ajoutez un nom', 'err');
    if (phone.replace(/\D/g, '').length < 6) return toast('Saisissez un numéro de téléphone valide', 'err');
    const digits = s => String(s || '').replace(/\D/g, '');
    if (state.clients.some(x => x.id !== ui.editId && digits(x.phone) === digits(phone) && norm(x.first) === norm(first) && norm(x.last) === norm(last))) return toast('Ce client existe déjà', 'err');
    const o = { first, last, phone, birth: d.birth || '', address: (d.address || '').trim(), notes: (d.notes || '').trim() };
    const editing = !!ui.editId, ctx = ui.clientCtx; let c;
    if (editing) { c = state.clients.find(x => x.id === ui.editId); Object.assign(c, o); }
    else { c = { id: uid(), ...o, created: new Date().toISOString() }; state.clients.push(c); }
    closeModal(); await persist([{ store: 'clients', put: c }]); toast(editing ? 'Client modifié' : 'Client ajouté');
    if (ctx === 'sale') { ui.cart.clientId = c.id; renderClientPicker(); }
    else if (ctx === 'fiche') { render(); openClient(c.id); }
    else render();
  },
  async material(f) {
    const d = Object.fromEntries(new FormData(f)), name = (d.name || '').trim();
    if (!name) return toast('Ajoutez un nom', 'err');
    const qty = Math.max(0, num(d.qty)), min = Math.max(0, num(d.min)), buy = Math.max(0, num(d.buy)), barcode = (d.barcode || '').trim();
    if (barcode && anyBarcodeUsed(barcode, ui.editId)) return toast('Ce code-barres est déjà utilisé', 'err');
    const o = { name, category: d.category.trim(), unit: d.unit, qty, min, buy, supplier: d.supplier.trim(), sku: d.sku.trim(), barcode, added: d.added || todayKey(), notes: d.notes.trim() };
    const ops = []; let m;
    if (ui.editId) { m = state.materials.find(x => x.id === ui.editId); const old = m.qty; Object.assign(m, o); if (old !== m.qty) ops.push({ store: 'pmoves', put: mkPMove('material', m, m.qty - old, m.unit, 'adjust') }); }
    else { m = { id: uid(), ...o }; state.materials.push(m); if (m.qty > 0) ops.push({ store: 'pmoves', put: mkPMove('material', m, m.qty, m.unit, 'init') }); }
    ops.push({ store: 'materials', put: m });
    if (o.category && !state.settings.materialCats.includes(o.category)) { state.settings.materialCats.push(o.category); state.settings.materialCats.sort((a, b) => a.localeCompare(b, 'fr')); ops.push({ store: 'settings', put: state.settings }); }
    closeModal(); await persist(ops); toast(ui.editId ? 'Matière modifiée' : 'Matière ajoutée'); render();
  },
  async container(f) {
    const d = Object.fromEntries(new FormData(f)), name = (d.name || '').trim();
    if (!name) return toast('Ajoutez un nom', 'err');
    const qty = Math.max(0, num(d.qty)), min = Math.max(0, num(d.min)), buy = Math.max(0, num(d.buy)), barcode = (d.barcode || '').trim();
    if (barcode && anyBarcodeUsed(barcode, ui.editId)) return toast('Ce code-barres est déjà utilisé', 'err');
    const o = { name, format: d.format.trim(), unit: d.unit, qty, min, buy, supplier: d.supplier.trim(), sku: d.sku.trim(), barcode };
    const ops = []; let c;
    if (ui.editId) { c = state.containers.find(x => x.id === ui.editId); const old = c.qty; Object.assign(c, o); if (old !== c.qty) ops.push({ store: 'pmoves', put: mkPMove('container', c, c.qty - old, c.unit, 'adjust') }); }
    else { c = { id: uid(), ...o }; state.containers.push(c); if (c.qty > 0) ops.push({ store: 'pmoves', put: mkPMove('container', c, c.qty, c.unit, 'init') }); }
    ops.push({ store: 'containers', put: c });
    if (o.format && !state.settings.containerFormats.includes(o.format)) { state.settings.containerFormats.push(o.format); state.settings.containerFormats.sort((a, b) => a.localeCompare(b, 'fr')); ops.push({ store: 'settings', put: state.settings }); }
    closeModal(); await persist(ops); toast(ui.editId ? 'Contenant modifié' : 'Contenant ajouté'); render();
  },
  async pmove(f) {
    const kind = ui.moveKind, arr = kind === 'material' ? state.materials : state.containers, it = arr.find(x => x.id === ui.editId); if (!it) return;
    const d = Object.fromEntries(new FormData(f)), type = d.type, qty = Math.max(0, num(d.qty)), reason = (d.reason || '').trim();
    let delta;
    if (type === 'in') { if (qty <= 0) return toast('Indiquez une quantité', 'err'); delta = qty; }
    else if (type === 'out') { if (qty <= 0) return toast('Indiquez une quantité', 'err'); if (qty > it.qty + 1e-9) return toast(`Stock insuffisant : disponible ${nf.format(it.qty)} ${it.unit}`, 'err'); delta = -qty; }
    else delta = qty - it.qty;
    it.qty = Math.max(0, it.qty + delta);
    closeModal();
    await persist([{ store: kind === 'material' ? 'materials' : 'containers', put: it }, { store: 'pmoves', put: mkPMove(kind, it, delta, it.unit, type, reason) }]);
    toast('Mouvement enregistré'); render();
  },
  async employee(f) {
    const d = Object.fromEntries(new FormData(f)), name = (d.name || '').trim();
    if (!name) return toast('Ajoutez un nom', 'err');
    const e = { id: uid(), name };
    state.employees.push(e);
    closeModal(); await persist([{ store: 'employees', put: e }]); toast('Employée ajoutée'); render();
  },
  async horedit(f) {
    const s = state.shifts.find(x => x.id === ui.editId); if (!s) return;
    const d = Object.fromEntries(new FormData(f)), reason = (d.reason || '').trim();
    if (!reason) return toast('Indiquez un motif', 'err');
    const before = { in: s.inTime, out: s.outTime };
    const mk = hm => { if (!hm) return ''; const [h, m] = hm.split(':').map(Number), dt = parseDay(s.date); dt.setHours(h, m, 0, 0); return dt.toISOString(); };
    const newIn = mk(d.in), newOut = mk(d.out);
    s.inTime = newIn; s.outTime = newOut;
    s.lateMin = newIn && state.settings.expectedArrival ? computeLate(state.settings.expectedArrival, newIn) : null;
    s.editLog = s.editLog || []; s.editLog.push({ date: new Date().toISOString(), before, after: { in: newIn, out: newOut }, reason });
    closeModal(); await persist([{ store: 'shifts', put: s }]); toast('Correction enregistrée'); render();
  },
  async adminpin(f) {
    const d = Object.fromEntries(new FormData(f));
    if ((d.pin || '') !== state.settings.adminPin) return toast('Code incorrect', 'err');
    closeModal(); ui.hor.view = 'admin'; render();
  }
};

document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t) return; const fn = actions[t.dataset.act]; if (fn) { e.preventDefault(); fn(t, e); } });
document.addEventListener('input', e => { const t = e.target.closest('[data-in]'); if (t && inputs[t.dataset.in]) inputs[t.dataset.in](t, e); });
document.addEventListener('change', e => { const t = e.target.closest('[data-ch]'); if (t && changes[t.dataset.ch]) changes[t.dataset.ch](t, e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modal-root .modal')) closeModal(); closeDrawer(); return; }
  const t = e.target.closest && e.target.closest('[data-key]'); if (t && keys[t.dataset.key]) keys[t.dataset.key](t, e);
});
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); forms[f.dataset.form] && forms[f.dataset.form](f); });
window.addEventListener('hashchange', () => { const r = location.hash.replace('#/', ''); if (pages[r] && r !== ui.route) { ui.route = r; render(); } });
window.addEventListener('storage', e => { if (e.key === 'shopy-session') { ui.session = loadSession(); render(); } });

let lastW = window.innerWidth, rzT;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (window.innerWidth !== lastW) { lastW = window.innerWidth; if (ui.route === 'stats') renderStatsBody(); } }, 150); });

/* ---------- Démarrage ---------- */
(async function boot() {
  try {
    await DB.open();
    state.products = await DB.getAll('products'); state.sales = await DB.getAll('sales');
    state.expenses = await DB.getAll('expenses'); state.moves = await DB.getAll('moves'); state.clients = await DB.getAll('clients');
    state.materials = await DB.getAll('materials'); state.containers = await DB.getAll('containers'); state.pmoves = await DB.getAll('pmoves'); state.perfumes = await DB.getAll('perfumes');
    state.employees = await DB.getAll('employees'); state.shifts = await DB.getAll('shifts');
    const st = (await DB.getAll('settings')).find(x => x.key === 'main');
    state.settings = { ...clone(DEFAULT_SETTINGS), ...(st || {}) };
    if (!st) await persist([{ store: 'settings', put: state.settings }]);
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  } catch (e) { console.error(e); state.persistent = false; state.settings = clone(DEFAULT_SETTINGS); }
  ui.session = state.settings.adminPin ? loadSession() : { role: 'admin', employeeId: null };
  if (ui.session.role === 'employee' && !state.employees.some(e => e.id === ui.session.employeeId)) ui.session = { role: null, employeeId: null };
  cloudInit();
  const r = location.hash.replace('#/', ''); if (pages[r]) ui.route = r;
  refreshSide(); render();
})();
</script>
